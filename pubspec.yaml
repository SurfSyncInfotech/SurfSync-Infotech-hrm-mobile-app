name: hrms_app
description: Frontend-only HRMS (Employee, HR/Admin, Super Admin) built with Flutter and GetX.
publish_to: none
version: 0.1.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  get: ^4.6.6
  google_fonts: ^6.2.1
  image_picker: ^1.2.4
  geolocator: ^13.0.2
  intl: ^0.19.0
  shared_preferences: ^2.5.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/surfsync_logo.png
